spring.application.name=api

# Conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/ticketpro
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# 'update' creará las tablas si no existen o añadirá los campos nuevos que has puesto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

ticketpro.app.jwtSecret=EstaEsUnaClaveSuperSecretaYMuyLargaParaElProyectoDeGrado2026!@#
ticketpro.app.jwtExpirationMs=86400000
